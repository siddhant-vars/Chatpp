services:
    nginx:
        image: nginx:alpine
        container_name: chatify-nginx
        ports:
            - "8000:8000"
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
            backend-1:
                condition: service_healthy
            backend-2:
                condition: service_healthy

    backend-1:
        build: .
        container_name: chatify-backend-1

        volumes:
            - .:/app
            - /app/node_modules

        command: npm run dev

        env_file:
            - .env

        environment:
            PORT: 8000
            INSTANCE_ID: instance-1
            REDIS_URL: redis://redis:6379

        depends_on:
            redis:
                condition: service_healthy

        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "require('http').get('http://localhost:8000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
                ]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 10s

    backend-2:
        build: .
        container_name: chatify-backend-2

        volumes:
            - .:/app
            - /app/node_modules

        command: npm run dev

        env_file:
            - .env

        environment:
            PORT: 8000
            INSTANCE_ID: instance-2
            REDIS_URL: redis://redis:6379

        depends_on:
            redis:
                condition: service_healthy

        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "require('http').get('http://localhost:8000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
                ]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 10s

    redis:
        image: redis:7-alpine
        container_name: chatify-redis
        ports:
            - "6379:6379"

        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

